tracker_node:
  ros__parameters:
    target_frame: "odom"

    tracker:
      max_match_center_xoy: 1.5
      max_match_theta: 0.628
      lost_time_threshold: 0.5
      tracking_threshold: 10

    ekf:
      sigma2_q_xyz: 5.0e-4
      sigma2_q_theta: 1.0e-2
      sigma2_q_r: 1.0e-6

      r_block: 5.0e-6
      r_center: 5.0e-5
      r_block_min: 1.0e-7
      r_center_min: 1.0e-7

    gns:
      min_a: 0.4
      max_a: 1.3
      min_w: 1.5
      max_w: 2.3

      max_iter: 50
      min_step: 1.0e-10
      obs_max_size: 150

      a_start: 0.9125
      w_start: 1.942
      c_start: 0.0
      min_first_solve_time: 1.5

    ekf_gns:
      sigma2_q_a: 0.1
      sigma2_q_w: 0.1
      sigma2_q_c: 100.0

      r_a: 1.0e-8
      r_w: 5.0e-4
      r_c: 1.0e-8
