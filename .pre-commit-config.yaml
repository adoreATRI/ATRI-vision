repos:
  # ------------------------
  # 通用与基础文件检查
  # ------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace       # 移除代码行尾的多余空格
      - id: end-of-file-fixer         # 确保文件末尾包含一个且仅包含一个空行
      - id: check-yaml                # 验证 YAML 文件语法 (检查 config、params文件)
      - id: check-xml                 # 验证 XML 文件语法 (检查 package.xml、launch.xml、urdf)
      - id: check-added-large-files   # 防止误提交超大文件 (默认限制 500KB)

  # ------------------------
  # Markdown 文件检查 (README.md、文档等)
  # ------------------------
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
      - id: markdownlint
        args: ["--fix"]

  # ------------------------
  # C++ 格式化
  # ------------------------
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v17.0.6
    hooks:
      - id: clang-format
        types_or: [c++, c]

  # ------------------------
  # Python 格式化与静态检查
  # ------------------------
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        args: ["--line-length=100"]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile=black"]

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        additional_dependencies: [flake8-bugbear]
        args: ["--max-line-length=100", "--ignore=E203,W503"]

  # ------------------------
  # CMakeLists.txt 格式化
  # ------------------------
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format

  # ------------------------
  # Shell 脚本检查 (常用于环境配置/一键启动脚本)
  # ------------------------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
